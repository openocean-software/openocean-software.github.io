site_name: Open Ocean Software
site_url: https://oceansoft.org
theme:
  name: material
  custom_dir: overrides
  palette:
    primary: custom
    accent: custom
  font:
    text: "IBM Plex Sans"
    code: "IBM Plex Mono"
  logo: assets/openocean-logo-no-text.svg

  features:
  - announce.dismiss
  - navigation.tabs
  - content.tabs.link
  - content.code.copy
  favicon: assets/favicon.png

# Loads data/*.yml (projects, events, team) and the latest forum topics into
# config.extra for the templates in overrides/. Set OCEANSOFT_SKIP_FORUM=1 to
# build offline.
hooks:
  - hooks/oceansoft.py

plugins:
  - search
  - redirects:
      redirect_maps:
        member-projects.md: projects/index.md

nav:
    - Home: index.md
    - Projects:
        - projects/index.md
        - MOOS-IvP: projects/moos-ivp.md
        - WHOI-ROS: projects/whoi-ros.md
        - Goby3: projects/goby3.md
        - DCCL: projects/dccl.md
    - Toolkit: toolkit.md
    - Join: join.md
    - Events:
        - Community Day UK, 4 Sep 2026: community-day-uk-2026.md
    - team.md
    - Survey: ros-maritime-survey.md
    - DevSecOps: devsecops.md
    - Forum: https://forum.oceansoft.org

markdown_extensions:
- attr_list
- md_in_html
- admonition
- tables
- pymdownx.details
- pymdownx.superfences
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji ""
    emoji_generator:

      !!python/name:material.extensions.emoji.to_svg ""
extra:
  social:
  - icon: fontawesome/brands/discourse
    link: https://forum.oceansoft.org
  - icon: fontawesome/brands/github
    link: https://github.com/openocean-software/
  generator: false
  # Shown in the project page trust panel. hooks/oceansoft.py fails the build
  # if devsecops.md doesn't carry the same fingerprint, so rotate both at once.
  signing_key:
    fingerprint: D7D7224D53A4F29E303FE01DEB505B68A5D063B0

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/directory.js

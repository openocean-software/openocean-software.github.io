name: check
on:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install -r requirements.txt pytest
      - run: pytest -q tests
      # --strict fails on broken internal links and bad nav entries, which is
      # what a bad edit to a page or data/*.yml usually produces.
      - run: mkdocs build --strict
        env:
          DISABLE_MKDOCS_2_WARNING: "true"

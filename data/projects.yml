# Member projects and Open Ocean initiatives shown on the home page, the
# directory (projects/index.md) and each project page (projects/<slug>.md).
#
# Required per entry: slug, name, kind, category, filter, summary
#   kind:   member | initiative
#   filter: autonomy | middleware | ros | encoding | simulation | oos  (directory filter chips)
#
# Leave a field out (or null) until the team has agreed on it; the templates
# hide anything that is not set rather than printing a placeholder. stage and
# badge are assigned at member review, see openocean-plan/member-projects.
#   stage: pond | explorer | estuary | bay | ocean
#   badge: research | community | project | product | ecosystem
#
# page: site-relative URL of the entry's page. Defaults to projects/<slug>/.
#
# standards: evidence URL per minimum from the documentation and
# maintainability policies. Any key left out renders as "not yet reviewed".
#   documentation:   purpose, usage, interface, assumptions
#   maintainability: build, contracts, verified, issues
#
# Other optional fields: language, middleware, license, latest_release,
# affiliation, tags, links, issues (tracker URL), scorecard (github.com/org/repo
# for the OpenSSF badge), apt_packages (marks the project as apt-packaged:
# chip, install button, signing key in the trust panel), apt_url (same, for a
# project with no #install section yet: the button links here instead),
# apt_channel (continuous for a project with no tagged releases packaged yet:
# the trust panel shows the continuous key, and the home page doesn't count it).

- slug: moos-ivp
  name: MOOS-IvP
  kind: member
  category: Autonomy
  filter: autonomy
  summary: >-
    Open-source C++ modules for autonomy on marine vehicles, with the IvP Helm
    multi-objective decision engine.
  language: C++
  middleware: MOOS
  maintainer: Mike Benjamin
  affiliation: MIT
  tags: [C++, MOOS]
  apt_packages: [moos-ivp-apps, moos-ivp-gui, moos-ivp-tools]
  links:
    - {label: Website, url: "https://oceanai.mit.edu/moos-ivp"}
    - {label: GitHub, url: "https://github.com/moos-ivp"}
  issues: "https://github.com/moos-ivp"

